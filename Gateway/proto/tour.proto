syntax = "proto3";

package tour;

service TourService {
  rpc CreateTour(CreateTourRequest) returns (CreateTourResponse);
}

message CreateTourRequest {
  string name = 1;
  string description = 2;
  string difficulty = 3;
  repeated string tags = 4;
  int64 author_id = 5;
}

message CreateTourResponse {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string difficulty = 4;
  repeated string tags = 5;
  string status = 6;
  double price = 7;
  int64 author_id = 8;
}
