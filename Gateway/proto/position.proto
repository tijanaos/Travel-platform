syntax = "proto3";

package position;

option java_package = "rs.ac.uns.ftn.soa.tours.grpc";
option java_outer_classname = "PositionServiceProto";
option java_multiple_files = true;

service TouristPositionService {
  rpc UpdatePosition(UpdatePositionRequest) returns (TouristPositionResponse);
  rpc GetPosition(GetPositionRequest) returns (TouristPositionResponse);
}

message UpdatePositionRequest {
  int64 tourist_id = 1;
  double latitude = 2;
  double longitude = 3;
}

message GetPositionRequest {
  int64 tourist_id = 1;
}

message TouristPositionResponse {
  int64 id = 1;
  int64 tourist_id = 2;
  double latitude = 3;
  double longitude = 4;
  string updated_at = 5;
}