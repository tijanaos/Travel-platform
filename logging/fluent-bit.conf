[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224

[FILTER]
    Name              record_modifier
    Match             *
    Record            host ${HOSTNAME}

[OUTPUT]
    Name              loki
    Match             *
    Host              loki
    Port              3100
    Labels            job=travel-platform
    Label_Keys        $container_name,$service
    Line_Format       json
    Auto_Kubernetes_Labels off
