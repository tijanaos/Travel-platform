services:
  stakeholders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stakeholders
    ports:
      - "5432:5432"
    volumes:
      - stakeholders-db-data:/var/lib/postgresql/data
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  stakeholders-service:
    build:
      context: ./Stakeholders
      dockerfile: Dockerfile
    environment:
      DB_HOST: stakeholders-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: stakeholders
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      stakeholders-db:
        condition: service_healthy
    networks:
      - travel-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    networks:
      - travel-network
    depends_on:
      - stakeholders-db
      - tours-db
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  blog-db:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: blog
    ports:
      - "27017:27017"
    volumes:
      - blog-db-data:/data/db
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 5

  blog-service:
    build:
      context: ./Blog
      dockerfile: Dockerfile
    environment:
      MONGO_URI: mongodb://blog-db:27017
      MONGO_DB: blog
      SERVER_PORT: 8081
      STAKEHOLDERS_URL: http://stakeholders-service:8080
    ports:
      - "8081:8081"
    volumes:
      - ./Blog/uploads:/app/uploads
    depends_on:
      blog-db:
        condition: service_healthy
    networks:
      - travel-network

  tours-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tours_db
    ports:
      - "5434:5432"
    volumes:
      - tours-db-data:/var/lib/postgresql/data
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  tours-service:
    build:
      context: ./Tours
      dockerfile: Dockerfile
    environment:
      DB_HOST: tours-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: tours_db
      STAKEHOLDERS_URL: http://stakeholders-service:8080
      UPLOAD_DIR: uploads
    ports:
      - "8082:8082"
    volumes:
      - ./Tours/uploads:/app/uploads
    depends_on:
      tours-db:
        condition: service_healthy
    networks:
      - travel-network

  follower-db:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/followerpass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - follower-db-data:/data
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  follower-service:
    build:
      context: ./Follower
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: bolt://follower-db:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: followerpass
      SERVER_PORT: 8083
      STAKEHOLDERS_URL: http://stakeholders-service:8080
      BLOG_URL: http://blog-service:8081
    ports:
      - "8083:8083"
    depends_on:
      follower-db:
        condition: service_healthy
      stakeholders-service:
        condition: service_started
      blog-service:
        condition: service_started
    networks:
      - travel-network

volumes:
  stakeholders-db-data:
  blog-db-data:
  tours-db-data:
  follower-db-data:
  pgadmin-data:

networks:
  travel-network:
    driver: bridge
