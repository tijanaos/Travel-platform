services:
  stakeholders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stakeholders
    ports:
      - "5432:5432"
    volumes:
      - stakeholders-db-data:/var/lib/postgresql/data
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"
        fluentd-async: "true"

  stakeholders-service:
    build:
      context: ./Stakeholders
      dockerfile: Dockerfile
    environment:
      DB_HOST: stakeholders-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: stakeholders
      SERVER_PORT: 8080
      GRPC_PORT: 9090
      FOLLOWER_URL: http://follower-service:8083
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      stakeholders-db:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    networks:
      - travel-network
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"
        fluentd-async: "true"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    networks:
      - travel-network
    depends_on:
      - stakeholders-db
      - tours-db
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  blog-db:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: blog
    ports:
      - "27017:27017"
    volumes:
      - blog-db-data:/data/db
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"
        fluentd-async: "true"

  blog-service:
    build:
      context: ./Blog
      dockerfile: Dockerfile
    environment:
      MONGO_URI: mongodb://blog-db:27017
      MONGO_DB: blog
      SERVER_PORT: 8081
      BASE_URL: http://localhost:8081
      STAKEHOLDERS_URL: http://stakeholders-service:8080
      GRPC_PORT: 9092
    ports:
      - "8081:8081"
      - "9092:9092"
    volumes:
      - ./Blog/uploads:/app/uploads
    depends_on:
      blog-db:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    networks:
      - travel-network
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"
        fluentd-async: "true"

  mongo-express:
    image: mongo-express:1.0.2-20
    environment:
      ME_CONFIG_MONGODB_SERVER: blog-db
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: false
    ports:
      - "8086:8081"
    depends_on:
      blog-db:
        condition: service_healthy
    networks:
      - travel-network

  tours-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tours_db
    ports:
      - "5434:5432"
    volumes:
      - tours-db-data:/var/lib/postgresql/data
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"
        fluentd-async: "true"

  tours-service:
    build:
      context: ./Tours
      dockerfile: Dockerfile
    environment:
      DB_HOST: tours-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: tours_db
      STAKEHOLDERS_URL: http://stakeholders-service:8080
      STAKEHOLDERS_GRPC_HOST: stakeholders-service
      STAKEHOLDERS_GRPC_PORT: 9090
      GRPC_SERVER_PORT: 9091
      UPLOAD_DIR: uploads
    ports:
      - "8082:8082"
      - "9091:9091"
    volumes:
      - ./Tours/uploads:/app/uploads
    depends_on:
      tours-db:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    networks:
      - travel-network
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"
        fluentd-async: "true"

  follower-db:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/followerpass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - follower-db-data:/data
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  follower-service:
    build:
      context: ./Follower
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: bolt://follower-db:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: followerpass
      SERVER_PORT: 8083
      STAKEHOLDERS_URL: http://stakeholders-service:8080
      BLOG_URL: http://blog-service:8081
      BLOG_GRPC_ADDRESS: blog-service:9092
    ports:
      - "8083:8083"
    depends_on:
      follower-db:
        condition: service_healthy
      stakeholders-service:
        condition: service_started
      blog-service:
        condition: service_started
      fluent-bit:
        condition: service_started
    networks:
      - travel-network
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"
        fluentd-async: "true"

  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    environment:
      PORT: 8084
      STAKEHOLDERS_URL: http://stakeholders-service:8080
      BLOG_URL: http://blog-service:8081
      TOURS_URL: http://tours-service:8082
      FOLLOWER_URL: http://follower-service:8083
      TOURS_GRPC_ADDRESS: tours-service:9091
      BLOG_GRPC_ADDRESS: blog-service:9092
    ports:
      - "8084:8084"
    depends_on:
      - stakeholders-service
      - blog-service
      - tours-service
      - follower-service
      - fluent-bit
    networks:
      - travel-network
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"
        fluentd-async: "true"

  # ── Observability stack ──────────────────────────────────────────────────────

  loki:
    image: grafana/loki:2.9.4
    ports:
      - "3100:3100"
    volumes:
      - ./logging/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - travel-network

  fluent-bit:
    image: fluent/fluent-bit:2.2
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./logging/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./logging/parsers.conf:/fluent-bit/etc/parsers.conf
    depends_on:
      - loki
    networks:
      - travel-network

  grafana:
    image: grafana/grafana:10.3.3
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./logging/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - travel-network

volumes:
  stakeholders-db-data:
  blog-db-data:
  tours-db-data:
  follower-db-data:
  pgadmin-data:
  loki-data:
  grafana-data:

networks:
  travel-network:
    driver: bridge
